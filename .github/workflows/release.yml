name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Checks
        run: ./gradlew detekt testDebugUnitTest
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WARDEN_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/warden.jks"
      - name: Build signed release APK
        env:
          WARDEN_KEYSTORE: ${{ runner.temp }}/warden.jks
          WARDEN_KEYSTORE_PASSWORD: ${{ secrets.WARDEN_KEYSTORE_PASSWORD }}
          WARDEN_KEY_ALIAS: ${{ secrets.WARDEN_KEY_ALIAS }}
          WARDEN_KEY_PASSWORD: ${{ secrets.WARDEN_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "warden-${GITHUB_REF_NAME}.apk"
          sha256sum "warden-${GITHUB_REF_NAME}.apk" > "warden-${GITHUB_REF_NAME}.apk.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            warden-${{ github.ref_name }}.apk
            warden-${{ github.ref_name }}.apk.sha256
          generate_release_notes: true
