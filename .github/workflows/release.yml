name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Without a signing key in the repo secrets this does nothing (releases are then published by hand).
    env:
      HAS_KEY: ${{ secrets.WARDEN_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Signing key configured?
        if: env.HAS_KEY != 'true'
        run: echo "No WARDEN_KEYSTORE_BASE64 secret; skipping the signed build."
      - uses: actions/checkout@v4
        if: env.HAS_KEY == 'true'
      - uses: actions/setup-java@v4
        if: env.HAS_KEY == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: env.HAS_KEY == 'true'
      - name: Checks
        if: env.HAS_KEY == 'true'
        run: ./gradlew detekt testDebugUnitTest
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.WARDEN_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/warden.jks"
      - name: Build signed release APKs
        if: env.HAS_KEY == 'true'
        env:
          WARDEN_KEYSTORE: ${{ runner.temp }}/warden.jks
          WARDEN_KEYSTORE_PASSWORD: ${{ secrets.WARDEN_KEYSTORE_PASSWORD }}
          WARDEN_KEY_ALIAS: ${{ secrets.WARDEN_KEY_ALIAS }}
          WARDEN_KEY_PASSWORD: ${{ secrets.WARDEN_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          for abi in arm64-v8a armeabi-v7a universal; do
            mv "app/build/outputs/apk/release/app-${abi}-release.apk" "warden-${GITHUB_REF_NAME}-${abi}.apk"
          done
          sha256sum warden-*.apk > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        if: env.HAS_KEY == 'true'
        with:
          files: |
            warden-*.apk
            SHA256SUMS.txt
          generate_release_notes: true
